<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Groww – Portfolio Understanding MVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/groww.css?v=3.5">
</head>

<body>

  <!-- Top Presentation Navigation Toolbar -->
  <header class="pres-header">
    <div class="brand-badge">
      <svg class="groww-logo-svg" viewBox="0 0 100 100" fill="none">
        <rect width="100" height="100" rx="22" fill="#00D09C" />
        <path d="M30 65 C40 45, 60 45, 70 30" stroke="#0D0E11" stroke-width="12" stroke-linecap="round" />
        <circle cx="70" cy="30" r="7" fill="#0D0E11" />
      </svg>
      <div>
        <div class="brand-title">Groww · Portfolio Understanding</div>
        <div style="font-size: 11px; color: #8B94A5;">"Why is my portfolio down?" MVP</div>
      </div>
      <span class="brand-tag">v2.0 Flow</span>
    </div>

    <!-- Step Flow Selector -->
    <div class="controls-group">
      <div class="mode-toggle">
        <button class="mode-btn flow-step-btn active" data-view="dashboard" title="Mutual Funds Portfolio Dashboard">
          1. Dashboard
        </button>
        <button class="mode-btn flow-step-btn" data-view="fund-detail" title="Fund Details Screen (Standard Groww)">
          2. Fund Details
        </button>
        <button class="mode-btn flow-step-btn" data-view="fund-select"
          title="Portfolio Insights (Why portfolio is down?)">
          3. Insights Select
        </button>
        <button class="mode-btn flow-step-btn" data-view="deepdive-scroll" title="Deep Dive Solution Report">
          4. Deep Dive Report
        </button>
        <button class="mode-btn flow-step-btn" data-view="detailed-summary" title="Detailed Summary & Analysis Report">
          5. Detailed Summary
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Viewport Simulator -->
  <main class="app-container">
    <div class="phone-frame">
      <!-- Main Dynamic Content Screen -->
      <div class="screen-content view-non-scroll" id="screen-content">
        <!-- Rendered by js/app.js -->
      </div>

      <!-- Groww Mobile Sticky Bottom Navigation (Matching Authentic Groww App) -->
      <nav class="bottom-nav">
        <div class="nav-item">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M3 3v18h18" />
            <path d="m19 9-5 5-4-4-3 3" />
          </svg>
          <span>Stocks</span>
        </div>
        <div class="nav-item">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="m7 7 10 10M17 7v10H7" />
          </svg>
          <span>F&O</span>
        </div>
        <div class="nav-item active">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8c1.66 0 3.19.51 4.47 1.39L12 12l4.95 4.95C15.71 19.06 13.97 20 12 20z" />
          </svg>
          <span>Mutual Funds</span>
        </div>
        <div class="nav-item">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="2" y="5" width="20" height="14" rx="2" />
            <line x1="2" y1="10" x2="22" y2="10" />
            <circle cx="6" cy="15" r="1.5" fill="currentColor" />
          </svg>
          <span>Loans</span>
        </div>
      </nav>
    </div>
  </main>

  <script src="js/data.js?v=3.8"></script>
  <script src="js/app.js?v=3.8"></script>
</body>

</html>
